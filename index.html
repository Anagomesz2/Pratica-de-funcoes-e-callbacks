<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Exercício 10 - Callback DOM</title>
</head>
<body>

  <button id="btnConfirmar">Confirmar</button>
  <p id="mensagem">Aguardando confirmação...</p>

  <script>
    function confirmarAcao() {
      const paragrafo = document.getElementById("mensagem");
      paragrafo.textContent = "Ação confirmada!";
    }

    const botao = document.getElementById("btnConfirmar");

    botao.addEventListener("click", confirmarAcao);
  </script>

</body>
</html>
